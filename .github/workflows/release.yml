name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: make check
      - name: Build macOS arm64 artifact
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_TAG}" -o dist/package/mail-server ./cmd/mail-server
          tar -C dist/package -czf "dist/mail-server_${RELEASE_TAG}_macOS_arm64.tar.gz" mail-server
          cd dist
          sha256sum "mail-server_${RELEASE_TAG}_macOS_arm64.tar.gz" >checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          archive="mail-server_${RELEASE_TAG}_macOS_arm64.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json isDraft,tagName,assets \
              --jq '[.isDraft,.tagName,(.assets|map(.name))] | @json' | \
              jq -e --arg tag "$RELEASE_TAG" --arg archive "$archive" \
                '.[0] == false and .[1] == $tag and (.[2]|index($archive) != null) and (.[2]|index("checksums.txt") != null)' >/dev/null
          else
            gh release create "$RELEASE_TAG" "dist/$archive" dist/checksums.txt \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
