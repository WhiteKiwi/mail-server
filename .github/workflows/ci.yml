name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only owner-triggered code from this repository uses the persistent worker.
    runs-on: ${{ fromJSON(github.actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)) && '["self-hosted","Linux","X64","whitekiwi-linux-mail-server"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    services:
      postgres:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_PASSWORD: integration-only
    steps:
      - name: Wait for PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres; then
              exit 0
            fi
            printf 'PostgreSQL not ready (%s/30)\n' "$attempt"
            sleep 2
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Validate migrations twice
        env:
          PGPASSWORD: integration-only
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec --env PGPASSWORD -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres < internal/migrations/001_initial.sql
          docker exec --env PGPASSWORD -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres < internal/migrations/001_initial.sql
